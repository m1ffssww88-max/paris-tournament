<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>باريس كوز | Paris Cos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B1E3F;
  --navy-2:#122a54;
  --red:#E11B3C;
  --red-2:#ff3d5c;
  --gold:#F2B33D;
  --ink:#EAF0FF;
  --mute:#9FB0D6;
  --card:#132446;
  --card-2:#0e1c38;
  --line:rgba(255,255,255,.08);
  --green:#25b26a;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 600px at 85% -10%, rgba(225,27,60,.18), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(46,90,180,.25), transparent 60%),
    var(--navy);
  color:var(--ink);
  font-family:'Cairo',sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:640px;margin:0 auto;padding:18px 16px 60px;position:relative}

/* ---------- Header / brand ---------- */
.brandbar{display:flex;align-items:center;gap:12px;padding:14px 4px 20px;justify-content:center}
.badge{
  width:52px;height:52px;border-radius:15px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 20px rgba(0,0,0,.4);
  flex-shrink:0;overflow:hidden;
}
.badge img{width:100%;height:100%;object-fit:cover;display:block}
.brand-name{font-weight:900;font-size:26px;line-height:1}
.brand-name .b1{color:#5B9BFF}
.brand-name .b2{color:var(--red-2)}
.brand-tagline{font-size:11px;color:var(--mute);letter-spacing:.5px;margin-top:2px}

.eiffel-watermark{
  position:fixed;left:50%;bottom:-40px;transform:translateX(-50%);
  width:340px;opacity:.05;pointer-events:none;z-index:0;
}

/* ---------- Cards / buttons ---------- */
.card{
  background:linear-gradient(180deg,var(--card),var(--card-2));
  border:1px solid var(--line);
  border-radius:16px;
  padding:18px;
  margin-bottom:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
  position:relative;z-index:1;
}
.card h2{margin:0 0 4px;font-size:17px;font-weight:700}
.card .sub{color:var(--mute);font-size:12.5px;margin-bottom:10px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:none;border-radius:12px;padding:13px 16px;
  font-family:'Cairo',sans-serif;font-weight:700;font-size:14.5px;
  cursor:pointer;width:100%;transition:transform .12s ease, filter .12s ease;
  color:white;
}
.btn:active{transform:scale(.98)}
.btn-primary{background:linear-gradient(135deg,var(--red),#b5122c)}
.btn-blue{background:linear-gradient(135deg,#2f5fd6,#1c3a86)}
.btn-gold{background:linear-gradient(135deg,var(--gold),#c48a1f);color:#241a00}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn-green{background:linear-gradient(135deg,#2fbf71,#17753f)}
.btn-sm{padding:9px 12px;font-size:13px;width:auto}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row .btn{flex:1;min-width:110px}
.btn:disabled{opacity:.4;cursor:not-allowed}

input[type=text],input[type=password],input[type=number],textarea,select{
  width:100%;background:#0a1730;border:1px solid var(--line);color:var(--ink);
  border-radius:10px;padding:11px 12px;font-family:'Cairo',sans-serif;font-size:14px;
  margin-bottom:8px;
}
textarea{resize:vertical;min-height:56px}
label{font-size:12.5px;color:var(--mute);display:block;margin-bottom:4px}

.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700}
.pill-wait{background:rgba(242,179,61,.15);color:var(--gold)}
.pill-half{background:rgba(91,155,255,.15);color:#8fb4ff}
.pill-ready{background:rgba(37,178,106,.18);color:#4be09b}
.pill-done{background:rgba(255,255,255,.08);color:var(--mute)}

.match-row{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:11px 12px;border-radius:12px;background:#0a1730;border:1px solid var(--line);
  margin-bottom:8px;cursor:pointer;
}
.match-row:hover{border-color:rgba(255,255,255,.2)}
.teams{font-size:13.5px;font-weight:700}
.teams .vs{color:var(--mute);font-weight:400;margin:0 6px}
.teams .win{color:var(--gold)}

.topnav{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px}
.topnav button{
  background:#0a1730;border:1px solid var(--line);color:var(--mute);
  padding:8px 14px;border-radius:999px;font-family:'Cairo';font-size:12.5px;font-weight:700;
  white-space:nowrap;cursor:pointer;
}
.topnav button.active{background:linear-gradient(135deg,var(--red),#b5122c);color:white;border-color:transparent}

.timer{
  font-family:'Roboto Mono',monospace;font-weight:700;font-size:34px;text-align:center;
  color:var(--gold);margin:4px 0 14px;
}
.timer.low{color:var(--red-2)}
.qnum{color:var(--mute);font-size:12px;letter-spacing:.5px;text-transform:uppercase;margin-bottom:2px}
.qtext{font-size:18px;font-weight:700;margin-bottom:14px;line-height:1.5}

.standrow{display:flex;align-items:center;gap:10px;padding:9px 8px;border-bottom:1px solid var(--line);font-size:13.5px}
.standrow .rank{width:22px;font-weight:900;color:var(--mute)}
.standrow .name{flex:1;font-weight:700}
.standrow .pts{font-weight:900;color:var(--gold)}
.standrow.q-direct{background:rgba(37,178,106,.22)}
.standrow.q-playoff{background:rgba(59,110,224,.22)}
.standrow.q-out{background:rgba(225,27,60,.20)}
.standrow.mine{box-shadow:0 0 0 2px var(--gold) inset;border-radius:8px}

.grade-q{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#0a1730}
.grade-q .qh{font-weight:700;margin-bottom:8px}
.ans-block{margin-bottom:8px}
.ans-block .who{font-size:11px;color:var(--mute);margin-bottom:3px}
.ans-block .txt{font-size:13.5px;background:#0e1c38;padding:8px 10px;border-radius:8px;margin-bottom:6px;min-height:18px}
.judge-btns{display:flex;gap:6px}
.jbtn{flex:1;padding:7px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--mute);font-family:Cairo;font-weight:700;font-size:12px;cursor:pointer}
.jbtn.correct.active{background:rgba(37,178,106,.2);border-color:var(--green);color:#4be09b}
.jbtn.wrong.active{background:rgba(225,27,60,.2);border-color:var(--red-2);color:#ff8fa0}

.voice-rules{background:#0a1730;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;font-size:13.5px;line-height:1.8}
.voice-rules li{margin-bottom:4px}
.rec-indicator{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--red-2);font-weight:700;margin-bottom:10px}
.rec-dot{width:9px;height:9px;border-radius:50%;background:var(--red-2);animation:recpulse 1.1s infinite}
.mic-ring{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;border:2px solid #2ecc71;box-shadow:0 0 0 3px rgba(46,204,113,.25);font-size:11px;line-height:1;animation:recpulse 1.4s infinite}
@keyframes recpulse{0%,100%{opacity:1}50%{opacity:.25}}
.voice-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--mute);font-family:Cairo;font-weight:700;font-size:11.5px;cursor:pointer;margin-inline-end:6px}
.voice-btn.has{color:var(--gold);border-color:var(--gold)}
.voice-player{margin-top:6px}
.voice-player audio{width:100%;height:32px}

.diff-row{display:flex;gap:5px;margin-bottom:6px}
.diffbtn{flex:1;padding:6px 4px;border-radius:8px;border:1px solid var(--line);background:transparent;font-family:'Cairo',sans-serif;font-weight:700;font-size:11px;cursor:pointer;color:var(--mute)}
.diffbtn.easy.active{background:rgba(59,110,224,.28);border-color:#3b6fe0;color:#8fb4ff}
.diffbtn.medium.active{background:rgba(242,179,61,.28);border-color:var(--gold);color:var(--gold)}
.diffbtn.hard.active{background:rgba(225,27,60,.28);border-color:var(--red-2);color:#ff8fa0}
.diffbtn.impossible.active{background:rgba(155,93,229,.28);border-color:#9b5de5;color:#c9a3f5}
.diff-badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800;margin-inline-start:6px;vertical-align:middle}
.diff-badge.easy{background:rgba(59,110,224,.28);color:#8fb4ff}
.diff-badge.medium{background:rgba(242,179,61,.28);color:var(--gold)}
.diff-badge.hard{background:rgba(225,27,60,.28);color:#ff8fa0}
.diff-badge.impossible{background:rgba(155,93,229,.28);color:#c9a3f5}

.tally{display:flex;justify-content:space-around;text-align:center;margin:14px 0}
.tally b{display:block;font-size:26px;color:var(--gold)}
.tally span{font-size:12px;color:var(--mute)}

.bracket-round{margin-bottom:18px}
.bracket-round h3{font-size:13px;color:var(--mute);margin:0 0 8px;letter-spacing:.5px}

/* ---------- knockout tree (R16 -> Final) ---------- */
.bracket-tree{display:flex;direction:ltr;overflow-x:auto;align-items:stretch;padding:16px 4px 24px;-webkit-overflow-scrolling:touch}
.bkt-half{display:flex;min-height:460px}
.bkt-half.half-right{flex-direction:row-reverse}
.bkt-round{display:flex;flex-direction:column;justify-content:space-around;position:relative;padding:0 15px;flex:1}
.bkt-pair{display:flex;flex-direction:column;justify-content:space-around;flex:1;position:relative}
.bkt-match-slot{flex:1;display:flex;align-items:center}
.bkt-match{
  direction:rtl;text-align:right;
  background:#0a1730;border:1px solid var(--line);border-radius:10px;
  width:118px;padding:7px 9px;font-size:11.5px;position:relative;z-index:1;
}
.bkt-match.empty{color:var(--mute);opacity:.5;text-align:center}
.bkt-match.decided{border-color:rgba(242,179,61,.55);box-shadow:0 0 0 1px rgba(242,179,61,.35) inset}
.bkt-match.mine{box-shadow:0 0 0 1px var(--gold) inset}
.bkt-team{padding:2px 0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bkt-team.win{color:var(--gold);font-weight:900}
.bkt-team.lose{color:var(--red-2);text-decoration:line-through;opacity:.65}
.half-left .bkt-round .bkt-match::after{content:'';position:absolute;top:50%;right:-15px;width:15px;height:2px;background:var(--line)}
.half-right .bkt-round .bkt-match::after{content:'';position:absolute;top:50%;left:-15px;width:15px;height:2px;background:var(--line)}
.half-left .bkt-pair::before{content:'';position:absolute;right:-15px;top:25%;bottom:25%;width:15px;border-top:2px solid var(--line);border-bottom:2px solid var(--line);border-right:2px solid var(--line)}
.half-right .bkt-pair::before{content:'';position:absolute;left:-15px;top:25%;bottom:25%;width:15px;border-top:2px solid var(--line);border-bottom:2px solid var(--line);border-left:2px solid var(--line)}
.bkt-final-col{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 14px;gap:8px}
.bkt-trophy{font-size:32px}
.bkt-champion{direction:rtl;font-weight:900;color:var(--gold);font-size:13px;text-align:center;white-space:nowrap}
.tiny{font-size:11px;color:var(--mute)}
.center{text-align:center}
.mb8{margin-bottom:8px}.mb14{margin-bottom:14px}.mt14{margin-top:14px}
hr.line{border:none;border-top:1px solid var(--line);margin:14px 0}
.back{color:var(--mute);font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;margin-bottom:12px}
.empty{text-align:center;color:var(--mute);font-size:13.5px;padding:30px 10px}
.grow-list{max-height:340px;overflow:auto}
.teamname-input{margin-bottom:6px}
.modal-overlay{position:fixed;inset:0;background:rgba(4,10,25,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal-box{background:linear-gradient(180deg,var(--card),var(--card-2));border:1px solid var(--line);border-radius:16px;padding:20px;max-width:420px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.modal-msg{font-size:14.5px;line-height:1.6;color:var(--ink)}

/* ---------------- forum (منتدى الهياط) ---------------- */
.badge-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red-2);margin-inline-start:4px;vertical-align:middle}
.msg-card{
  background:#0a1730;border-radius:12px;padding:12px 14px;margin-bottom:10px;
  border-inline-start:4px solid var(--line);
}
.msg-card.msg-green{border-inline-start-color:var(--green)}
.msg-card.msg-blue{border-inline-start-color:#3b6fe0}
.msg-card.msg-red{border-inline-start-color:var(--red-2)}
.msg-card.msg-neutral{border-inline-start-color:var(--mute)}
.msg-card.msg-founder{border-inline-start-color:var(--gold);background:linear-gradient(180deg,rgba(242,179,61,.08),#0a1730)}

  display:inline-flex;align-items:center;justify-content:center;
  width:26px;height:26px;border-radius:9px;font-size:14px;
  margin-inline-start:6px;vertical-align:middle;
  box-shadow:0 3px 8px rgba(0,0,0,.30);
}
.ico-navy{background:linear-gradient(135deg,#2a4a86,var(--navy))}
.ico-red{background:linear-gradient(135deg,var(--red-2),#a30f27)}
.ico-gold{background:linear-gradient(135deg,#ffd479,var(--gold))}
.ico-blue{background:linear-gradient(135deg,#7fb1ff,#2f5fd6)}
.ico-green{background:linear-gradient(135deg,#5be3a4,#17753f)}
h2 .ico{width:24px;height:24px;font-size:13px;margin-inline-start:8px}
.pill .ico{width:18px;height:18px;font-size:10.5px;border-radius:6px;margin-inline-start:5px;box-shadow:none}
.reactions{display:flex;gap:6px;flex-wrap:wrap}
.reaction-btn{
  background:#0e1c38;border:1px solid var(--line);border-radius:999px;padding:4px 9px;
  font-size:13px;cursor:pointer;color:var(--ink);font-family:'Cairo',sans-serif;
}
.reaction-btn.mine{border-color:var(--gold);background:rgba(242,179,61,.15)}
.charcount{text-align:left;font-size:11px;color:var(--mute);margin:-4px 0 8px}
</style>

<script>
(function(){
  const firebaseConfig = {
    apiKey: "AIzaSyAUFFZyilwd81cfywzPBb_OmRA1rp3-aNg",
    authDomain: "mshmsh-d6437.firebaseapp.com",
    databaseURL: "https://mshmsh-d6437-default-rtdb.firebaseio.com",
    projectId: "mshmsh-d6437",
    storageBucket: "mshmsh-d6437.firebasestorage.app",
    messagingSenderId: "186401872829",
    appId: "1:186401872829:web:04605fbb70ded30f2cd0d4",
    measurementId: "G-38Z48MPM6G"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // Drop-in replacement for the old window.storage API, same shape/behavior,
  // but backed by real persistent storage instead of an in-memory session:
  //  - shared=true  -> Firestore (synced across every device/player)
  //  - shared=false -> localStorage (this device only — used for "which team am I" etc.)
  window.storage = {
    async get(key, shared){
      if(!shared){
        const v = localStorage.getItem('ps_local_'+key);
        if(v===null) throw new Error('not found: '+key);
        return {key, value:v, shared:false};
      }
      const snap = await db.collection('paris_cos').doc(key).get();
      if(!snap.exists) throw new Error('not found: '+key);
      return {key, value: snap.data().value, shared:true};
    },
    async set(key, value, shared){
      if(!shared){
        localStorage.setItem('ps_local_'+key, value);
        return {key, value, shared:false};
      }
      await db.collection('paris_cos').doc(key).set({value});
      return {key, value, shared:true};
    },
    async delete(key, shared){
      if(!shared){
        localStorage.removeItem('ps_local_'+key);
        return {key, deleted:true, shared:false};
      }
      await db.collection('paris_cos').doc(key).delete();
      return {key, deleted:true, shared:true};
    }
  };
})();
</script>

/* ---------------- sound effects (generated, no external files) ---------------- */
let AUDIO_CTX = null;
function getAudioCtx(){
  try{
    if(!AUDIO_CTX) AUDIO_CTX = new (window.AudioContext||window.webkitAudioContext)();
    if(AUDIO_CTX.state==='suspended') AUDIO_CTX.resume();
    return AUDIO_CTX;
  }catch(e){ return null; }
}
function beep(freq, duration, vol, type){
  const ctx = getAudioCtx();
  if(!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type||'sine';
  osc.frequency.value = freq;
  const now = ctx.currentTime;
  gain.gain.setValueAtTime(vol||0.06, now);
  gain.gain.exponentialRampToValueAtTime(0.0001, now+duration);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(now); osc.stop(now+duration);
}
function playClickSound(){ beep(700, .07, .05, 'square'); }
function playTickSound(){ beep(520, .07, .045, 'sine'); }
function playTickUrgentSound(){ beep(900, .1, .07, 'square'); }
function playTimeUpSound(){ beep(220, .35, .08, 'sawtooth'); }

/* ---------------- storage helpers ---------------- */
let SAVE_QUEUE = Promise.resolve(); // serializes all writes so concurrent clicks/polling can't race each other
let IS_MUTATING = false;

async function loadState(){
  try{
    const r = await window.storage.get('tournament', true);
    STATE = r && r.value ? JSON.parse(r.value) : defaultState();
  }catch(e){ STATE = defaultState(); }
  ensureForum(STATE);
  try{
    const m = await window.storage.get('my_team', false);
    MY_TEAM = m && m.value ? JSON.parse(m.value) : null;
  }catch(e){ MY_TEAM = null; }
}
async function saveState(){
  // retry once before giving up — most "save failed" cases are a transient hiccup, not a real failure
  for(let attempt=0; attempt<2; attempt++){
    try{
      await window.storage.set('tournament', JSON.stringify(STATE), true);
      return true;
    }catch(e){
      console.error('save failed (attempt '+(attempt+1)+')', e);
      if(attempt===0) await new Promise(res=>setTimeout(res, 500));
    }
  }
  showAlert('تعذر الحفظ، حاول مرة أخرى');
  return false;
}
// re-fetch latest shared state, apply a mutation function, then save (reduces write collisions).
// Queued/serialized: if you tap several buttons quickly, each mutation waits its turn instead of
// racing the previous one — that race was causing occasional false "save failed" messages.
function mutate(fn){
  const run = SAVE_QUEUE.then(async ()=>{
    IS_MUTATING = true;
    try{
      try{
        const r = await window.storage.get('tournament', true);
        if(r && r.value) STATE = JSON.parse(r.value);
      }catch(e){}
      ensureForum(STATE);
      fn(STATE);
      await saveState();
    } finally {
      IS_MUTATING = false;
    }
  });
  SAVE_QUEUE = run.catch(()=>{}); // keep the chain alive even if one link fails
  return run;
}
async function setMyTeam(id){
  MY_TEAM = id;
  try{ await window.storage.set('my_team', JSON.stringify(id), false); }catch(e){}
}
async function logout(){
  MY_TEAM = null;
  try{ await window.storage.delete('my_team', false); }catch(e){}
}

/* ---------------- participant secret codes ---------------- */
const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no 0/O/1/I to avoid confusion
function generateCode(existingCodes){
  let code;
  do{
    code = '';
    for(let i=0;i<6;i++) code += CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)];
  }while(existingCodes.has(code));
  return code;
}

/* ---------------- default state / schedule ---------------- */
function defaultState(){
  const codes = new Set();
  const teams = Array.from({length:32}, (_,i)=>{
    const code = generateCode(codes); codes.add(code);
    return {id:'t'+(i+1), name:'مشارك '+(i+1), code, muted:false};
  });
  return {
    adminCode:'999900RTAG',
    founderHandle:'ryu',
    forum: { messages: [] },
    teams,
    stage:'setup', // setup -> league -> playoff -> r16 -> qf -> sf -> final -> done
    league:{ rounds:[], currentRound:1, roundStarted:{} },
    playoff:{ matches:[], startedAt:null },
    r16:{ matches:[], startedAt:null },
    qf:{ matches:[], startedAt:null },
    sf:{ matches:[], startedAt:null },
    final:{ match:null, startedAt:null },
    champion:null
  };
}

function shuffleArr(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function pairKey(a,b){ return a<b ? a+'|'+b : b+'|'+a; }

// finds a random perfect matching of teamIds where no pair is already in usedPairs
function randomMatchingAvoiding(teamIds, usedPairs){
  for(let attempt=0; attempt<400; attempt++){
    const pairs = [];
    if(tryMatch(shuffleArr(teamIds), usedPairs, pairs)) return pairs;
  }
  return null; // extremely unlikely with 32 teams / 8 rounds
}
function tryMatch(pool, usedPairs, pairs){
  if(pool.length===0) return true;
  const a = pool[0];
  const rest = pool.slice(1);
  const order = shuffleArr(rest.map((_,i)=>i));
  for(const i of order){
    const b = rest[i];
    if(usedPairs.has(pairKey(a,b))) continue;
    const newRest = rest.slice(0,i).concat(rest.slice(i+1));
    pairs.push([a,b]);
    if(tryMatch(newRest, usedPairs, pairs)) return true;
    pairs.pop();
  }
  return false;
}

function newMatch(phase, teamA, teamB, round){
  return {
    id: phase+'_'+(round||0)+'_'+teamA+'_'+teamB+'_'+Math.random().toString(36).slice(2,7),
    phase, round: round||null,
    teamA, teamB,
    questions: Array.from({length:10}, ()=>({text:'', difficulty:null, a:{text:'',judge:null}, b:{text:'',judge:null}})),
    status:'pending', // pending(no Qs) -> ready -> finished
    winner:null // teamId | 'draw'
  };
}

// round1Pairs (optional): array of 16 [teamA,teamB] pairs chosen manually by the founder.
// Every round is guaranteed to contain no repeated matchup across the whole league phase.
function generateLeague(round1Pairs){
  const ids = STATE.teams.map(t=>t.id);
  const usedPairs = new Set();
  const allRounds = [];

  let firstPairs = (round1Pairs && round1Pairs.length===16) ? round1Pairs : randomMatchingAvoiding(ids, usedPairs);
  if(!firstPairs) firstPairs = randomMatchingAvoiding(ids, usedPairs); // fallback safety
  firstPairs.forEach(([a,b])=> usedPairs.add(pairKey(a,b)));
  allRounds.push(firstPairs);

  for(let r=2; r<=8; r++){
    const pairs = randomMatchingAvoiding(ids, usedPairs);
    pairs.forEach(([a,b])=> usedPairs.add(pairKey(a,b)));
    allRounds.push(pairs);
  }

  STATE.league.rounds = allRounds.map((round, ri)=> round.map(([a,b])=> newMatch('league', a, b, ri+1)));
  STATE.league.currentRound = 1;
  STATE.stage = 'league';
}

function teamName(id){
  if(!id) return '—';
  const t = STATE.teams.find(t=>t.id===id);
  return t? t.name : id;
}

/* ---------------- answer helpers ---------------- */
function sideKey(match, teamId){
  if(match.teamA===teamId) return 'a';
  if(match.teamB===teamId) return 'b';
  return null;
}
function firstUnanswered(match, side){
  for(let i=0;i<match.questions.length;i++){
    if(!match.questions[i][side].text) return i;
  }
  return -1; // all answered
}
function sideDone(match, side){
  return firstUnanswered(match, side) === -1;
}
function matchRowLabel(m, prog){
  prog = prog || matchProgressLabel(m);
  if(m.status==='finished'){
    if(m.winner==='draw') return 'تعادل — منتهية';
    const forfeitTag = (m.forfeit==='a'||m.forfeit==='b') ? ' (بالتغيّب بعد 24 ساعة)' : '';
    return 'منتهية: '+teamName(m.winner)+' فاز'+forfeitTag;
  }
  if(m.status==='expired') return '⏱ انتهت المهلة — بانتظار قرار المؤسس';
  return prog.n;
}
function matchProgressLabel(match){
  const da = sideDone(match,'a'), db = sideDone(match,'b');
  if(da && db) return {n:'2/2', cls:'pill-ready'};
  if(da || db) return {n:'1/2', cls:'pill-half'};
  return {n:'0/2', cls:'pill-wait'};
}
function findTeamMatch(teamId){
  // finds the active (unfinished) match for this team in the current stage
  const stage = STATE.stage;
  const list = matchesOfStage(stage);
  return list.find(m => (m.teamA===teamId || m.teamB===teamId) && m.status!=='finished' && m.status!=='pending');
}
function matchesOfStage(stage){
  if(stage==='league'){
    const r = STATE.league.currentRound;
    return (STATE.league.rounds[r-1]||[]);
  }
  if(stage==='playoff') return STATE.playoff.matches;
  if(stage==='r16') return STATE.r16.matches;
  if(stage==='qf') return STATE.qf.matches;
  if(stage==='sf') return STATE.sf.matches;
  if(stage==='final') return STATE.final.match ? [STATE.final.match] : [];
  return [];
}

/* ---------------- standings ---------------- */
function computeStandings(){
  const tbl = {};
  STATE.teams.forEach(t=> tbl[t.id] = {id:t.id, name:t.name, pts:0, w:0, d:0, l:0, p:0});
  STATE.league.rounds.forEach(round=>{
    round.forEach(m=>{
      if(m.status!=='finished') return;
      tbl[m.teamA].p++; tbl[m.teamB].p++;
      if(m.winner==='draw'){ tbl[m.teamA].pts+=1; tbl[m.teamB].pts+=1; tbl[m.teamA].d++; tbl[m.teamB].d++; }
      else if(m.winner===m.teamA){ tbl[m.teamA].pts+=3; tbl[m.teamA].w++; tbl[m.teamB].l++; }
      else if(m.winner===m.teamB){ tbl[m.teamB].pts+=3; tbl[m.teamB].w++; tbl[m.teamA].l++; }
    });
  });
  return Object.values(tbl).sort((x,y)=>{
    if(y.pts!==x.pts) return y.pts-x.pts;      // more points first
    if(y.w!==x.w) return y.w-x.w;              // more wins first
    if(x.l!==y.l) return x.l-y.l;              // fewer losses first (a loss must rank below teams that never played/lost)
    return x.p-y.p;                            // fewer matches played first (untouched teams stay above a team that already lost)
  });
}

/* ---------------- knockout progression ---------------- */
function allFinished(list){ return list.length>0 && list.every(m=>m.status==='finished'); }

/* ---------------- 24-hour timer + auto-forfeit ---------------- */
// returns when this match's 24h clock began, based on its phase (league round vs. a whole knockout stage)
function matchStartedAt(m){
  if(!m) return null;
  if(m.phase==='league') return STATE.league.roundStarted[m.round] || null;
  const acc = STATE[m.phase];
  return acc ? (acc.startedAt || null) : null;
}
function matchStageStarted(m){ return !!matchStartedAt(m); }

// if a match's 24h deadline has passed and it isn't finished, resolve it:
// - if only one side finished all their answers, that side wins by forfeit
// - if neither finished, whoever answered more questions wins by forfeit
// - if it's an exact tie (including 0-0, nobody showed up), mark 'expired' for the founder to decide manually
function resolveForfeitIfExpired(m, startedAt){
  if(!m || m.status==='finished' || !startedAt) return false;
  const deadline = startedAt + 24*3600000;
  if(Date.now() < deadline) return false;
  const doneA = sideDone(m,'a'), doneB = sideDone(m,'b');
  if(doneA && doneB) return false; // both finished — leave for normal grading, not a forfeit case
  if(doneA && !doneB){ m.winner=m.teamA; m.status='finished'; m.forfeit='b'; return true; }
  if(doneB && !doneA){ m.winner=m.teamB; m.status='finished'; m.forfeit='a'; return true; }
  const ansA = m.questions.filter(q=>q.a.text).length;
  const ansB = m.questions.filter(q=>q.b.text).length;
  if(ansA===ansB){ m.status='expired'; m.forfeit='tie'; return true; }
  if(ansA>ansB){ m.winner=m.teamA; m.status='finished'; m.forfeit='b'; }
  else { m.winner=m.teamB; m.status='finished'; m.forfeit='a'; }
  return true;
}
// sweeps every started round/stage and auto-resolves any match whose 24h window has expired
function applyForfeits(){
  let changed = false;
  (STATE.league.rounds||[]).forEach((round, ri)=>{
    const startedAt = STATE.league.roundStarted[ri+1];
    round.forEach(m=>{ if(resolveForfeitIfExpired(m, startedAt)) changed = true; });
  });
  ['playoff','r16','qf','sf'].forEach(stage=>{
    const acc = STATE[stage];
    if(acc && acc.matches) acc.matches.forEach(m=>{ if(resolveForfeitIfExpired(m, acc.startedAt)) changed = true; });
  });
  if(STATE.final && STATE.final.match && resolveForfeitIfExpired(STATE.final.match, STATE.final.startedAt)) changed = true;
  return changed;
}
async function checkForfeitsAndSave(){
  await mutate(s=>{ STATE = s; applyForfeits(); });
}

function startPlayoffFromStandings(){
  const st = computeStandings();
  const playoffTeams = st.slice(8,24).map(t=>t.id); // ranks 9-24 -> 16 teams
  const shuffled = playoffTeams.slice().sort(()=>Math.random()-0.5);
  const matches = [];
  for(let i=0;i<shuffled.length;i+=2){
    matches.push(newMatch('playoff', shuffled[i], shuffled[i+1]));
  }
  STATE.playoff.matches = matches;
  STATE.playoff.startedAt = null;
  STATE.stage='playoff';
}
function drawR16(){
  const st = computeStandings();
  const direct = st.slice(0,8).map(t=>t.id);
  const playoffWinners = STATE.playoff.matches.map(m=>m.winner).filter(w=>w && w!=='draw');
  const pool = direct.concat(playoffWinners).sort(()=>Math.random()-0.5);
  const matches = [];
  for(let i=0;i<pool.length;i+=2){
    matches.push(newMatch('r16', pool[i], pool[i+1]));
  }
  STATE.r16.matches = matches;
  STATE.r16.startedAt = null;
  STATE.stage='r16';
}
function advanceToQF(){
  const winners = STATE.r16.matches.map(m=>m.winner);
  const matches=[];
  for(let i=0;i<winners.length;i+=2) matches.push(newMatch('qf', winners[i], winners[i+1]));
  STATE.qf.matches = matches; STATE.qf.startedAt = null; STATE.stage='qf';
}
function advanceToSF(){
  const winners = STATE.qf.matches.map(m=>m.winner);
  const matches=[];
  for(let i=0;i<winners.length;i+=2) matches.push(newMatch('sf', winners[i], winners[i+1]));
  STATE.sf.matches = matches; STATE.sf.startedAt = null; STATE.stage='sf';
}
function advanceToFinal(){
  const winners = STATE.sf.matches.map(m=>m.winner);
  STATE.final.match = newMatch('final', winners[0], winners[1]);
  STATE.final.startedAt = null;
  STATE.stage='final';
}
function crownChampion(){
  STATE.champion = STATE.final.match.winner;
  STATE.stage='done';
}

/* =========================================================
   FORUM (منتدى الهياط)
   ========================================================= */
const FOUNDER_HANDLE_DEFAULT = 'ryu';
const REACTIONS = ['🤌','💥','🍭','🫡','😂'];
let FORUM_LAST_READ = 0; // personal, per-device — timestamp of last time this device opened the forum

function ensureForum(s){
  if(!s) return;
  if(!s.forum) s.forum = { messages: [] };
  if(!Array.isArray(s.forum.messages)) s.forum.messages = [];
  if(!s.founderHandle) s.founderHandle = FOUNDER_HANDLE_DEFAULT;
  (s.teams||[]).forEach(t=>{ if(t.muted===undefined) t.muted=false; });
}

async function loadForumLastRead(){
  try{
    const r = await window.storage.get('forum_last_read', false);
    FORUM_LAST_READ = r && r.value ? parseInt(r.value) : 0;
  }catch(e){ FORUM_LAST_READ = 0; }
}
async function markForumRead(){
  FORUM_LAST_READ = Date.now();
  try{ await window.storage.set('forum_last_read', String(FORUM_LAST_READ), false); }catch(e){}
}

function normalizeHandle(s){
  return (s||'').toString().trim().toLowerCase().replace(/\s+/g,'');
}
function teamHandle(team){ return normalizeHandle(team.name); }

// which "round" of the tournament we're currently in — used to allow one message per round.
// mirrors the league round while in the league stage, and one slot per knockout stage after that.
function forumRoundKey(){
  if(STATE.stage==='league') return 'league-r'+STATE.league.currentRound;
  if(['playoff','r16','qf','sf','final'].includes(STATE.stage)) return STATE.stage;
  return null; // setup / done — forum posting closed for participants
}

// who is "speaking" on this device right now: the founder (if currently in the admin panel)
// or the logged-in participant. Returns null if nobody is logged in at all.
function myForumIdentity(){
  if(UI._isAdmin) return {type:'founder'};
  if(MY_TEAM && STATE.teams.some(t=>t.id===MY_TEAM)) return {type:'team', teamId:MY_TEAM};
  return null;
}
function handleForIdentity(idn){
  if(!idn) return '';
  if(idn.type==='founder') return normalizeHandle(STATE.founderHandle || FOUNDER_HANDLE_DEFAULT);
  const t = STATE.teams.find(x=>x.id===idn.teamId);
  return t? teamHandle(t) : '';
}
function voterKeyForIdentity(idn){
  return idn.type==='founder' ? 'founder' : idn.teamId;
}

function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// finds every @handle mentioned in a raw message (lowercased, for matching)
function extractMentionHandles(text){
  const found = new Set();
  const re = /@([\p{L}\p{N}_]+)/gu;
  let m;
  while((m = re.exec(text||''))) found.add(m[1].toLowerCase());
  return Array.from(found);
}
// escapes the text then highlights @mentions — safe because escaping happens first
function renderMessageHtml(text){
  const escaped = escapeHtml(text);
  return escaped.replace(/@([\p{L}\p{N}_]+)/gu, (whole, h)=> `<span class="msg-mention">@${h}</span>`);
}

function rankTierOfTeam(teamId){
  if(STATE.stage==='setup') return 'neutral';
  const st = computeStandings();
  const idx = st.findIndex(t=>t.id===teamId);
  if(idx===-1) return 'neutral';
  if(idx<8) return 'green';
  if(idx<24) return 'blue';
  return 'red';
}
function messageHandle(msg){
  if(msg.authorType==='founder') return normalizeHandle(STATE.founderHandle || FOUNDER_HANDLE_DEFAULT);
  const t = STATE.teams.find(x=>x.id===msg.teamId);
  return t? teamHandle(t) : '';
}
const SPECIAL_FRAME_HANDLE = 'l_8x4';
function messageBorderClass(msg){
  const base = msg.authorType==='founder' ? 'msg-founder' : 'msg-'+rankTierOfTeam(msg.teamId);
  if(messageHandle(msg) === SPECIAL_FRAME_HANDLE) return base+' msg-elite';
  return base;
}
function reactionVoterNames(list){
  return (list||[]).map(v=> v==='founder' ? ('المؤسس ('+(STATE.founderHandle||FOUNDER_HANDLE_DEFAULT)+')') : teamName(v)).join('، ');
}

function myUnreadMentions(){
  const idn = myForumIdentity();
  if(!idn || !STATE.forum) return [];
  const handle = handleForIdentity(idn);
  if(!handle) return [];
  return STATE.forum.messages.filter(m=> m.ts > FORUM_LAST_READ && extractMentionHandles(m.text).includes(handle));
}

async function sendForumMessage(rawText){
  const idn = myForumIdentity();
  if(!idn) return;
  let text = (rawText||'').trim();
  if(!text) return;
  const maxLen = idn.type==='founder' ? 1000 : 300;
  text = text.slice(0, maxLen);
  await mutate(s=>{
    STATE = s; ensureForum(s);
    if(idn.type==='team'){
      const team = s.teams.find(t=>t.id===idn.teamId);
      if(!team || team.muted) return; // muted — can view, can't post
      const key = forumRoundKey();
      if(key===null) return; // tournament not running — forum closed for participants
      const already = s.forum.messages.some(m=> m.authorType==='team' && m.teamId===idn.teamId && m.roundKey===key);
      if(already) return; // one message per round
      s.forum.messages.push({
        id:'m'+Date.now()+Math.random().toString(36).slice(2,7),
        authorType:'team', teamId:idn.teamId, text, ts:Date.now(), roundKey:key, reactions:{}
      });
    } else {
      s.forum.messages.push({
        id:'m'+Date.now()+Math.random().toString(36).slice(2,7),
        authorType:'founder', teamId:null, text, ts:Date.now(), roundKey:null, reactions:{}
      });
    }
  });
}
async function toggleReaction(msgId, emoji){
  const idn = myForumIdentity();
  if(!idn) return;
  const voter = voterKeyForIdentity(idn);
  await mutate(s=>{
    STATE = s; ensureForum(s);
    const msg = s.forum.messages.find(m=>m.id===msgId);
    if(!msg) return;
    if(!msg.reactions) msg.reactions = {};
    if(!msg.reactions[emoji]) msg.reactions[emoji] = [];
    const list = msg.reactions[emoji];
    const i = list.indexOf(voter);
    if(i>=0) list.splice(i,1); else list.push(voter);
  });
}
async function deleteForumMessage(msgId){
  await mutate(s=>{
    STATE = s; ensureForum(s);
    s.forum.messages = s.forum.messages.filter(m=>m.id!==msgId);
  });
}
async function toggleMute(teamId){
  await mutate(s=>{
    STATE = s; ensureForum(s);
    const t = s.teams.find(x=>x.id===teamId);
    if(t) t.muted = !t.muted;
  });
}

function bracketMatchLine(m){
  const wA = m.winner===m.teamA, wB = m.winner===m.teamB;
  const isMine = MY_TEAM && (m.teamA===MY_TEAM || m.teamB===MY_TEAM);
  return `<div class="match-row" style="cursor:default;${isMine?'border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;':''}">
    <div class="teams">
      <span class="${wA?'win':''}">${teamName(m.teamA)}</span>
      <span class="vs">×</span>
      <span class="${wB?'win':''}">${teamName(m.teamB)}</span>
    </div>
    <span class="pill ${m.status==='finished'?'pill-ready':'pill-wait'}">${m.status==='finished'? (m.winner==='draw'?'تعادل':'انتهت'):'قائمة'}</span>
  </div>`;
}

// single match box for the R16 -> Final tree: loser struck through in red, winner in gold
function bktMatchHtml(m){
  if(!m) return `<div class="bkt-match empty"><div class="bkt-team">—</div><div class="bkt-team">—</div></div>`;
  const decided = m.status==='finished';
  const wA = decided && m.winner===m.teamA;
  const wB = decided && m.winner===m.teamB;
  const isMine = MY_TEAM && (m.teamA===MY_TEAM || m.teamB===MY_TEAM);
  return `<div class="bkt-match ${decided?'decided':''} ${isMine?'mine':''}">
    <div class="bkt-team ${wA?'win':(decided?'lose':'')}">${teamName(m.teamA)}</div>
    <div class="bkt-team ${wB?'win':(decided?'lose':'')}">${teamName(m.teamB)}</div>
  </div>`;
}
function bktPairsHtml(arr){
  let out = '';
  for(let i=0;i<arr.length;i+=2){
    out += `<div class="bkt-pair">
      <div class="bkt-match-slot">${bktMatchHtml(arr[i])}</div>
      <div class="bkt-match-slot">${bktMatchHtml(arr[i+1])}</div>
    </div>`;
  }
  return out;
}
// the mirrored tree from the R16 (8 matches) down to the Final, converging on a trophy in the middle,
// matching: two R16 matches feed one QF slot, two QF matches feed one SF slot, the two SF winners meet in the Final.
function renderKnockoutTree(){
  const r16 = STATE.r16.matches || [];
  if(!r16.length) return '';
  const r16L = r16.slice(0,4), r16R = r16.slice(4,8);
  const qf = STATE.qf.matches || [];
  const qfL = qf.slice(0,2), qfR = qf.slice(2,4);
  const sf = STATE.sf.matches || [];
  const sfL = sf[0] || null, sfR = sf[1] || null;
  const final = STATE.final.match;
  return `<div class="bracket-tree">
    <div class="bkt-half half-left">
      <div class="bkt-round round-r16">${bktPairsHtml(r16L)}</div>
      <div class="bkt-round round-qf">${bktPairsHtml(qfL)}</div>
      <div class="bkt-round round-sf">${bktMatchHtml(sfL)}</div>
    </div>
    <div class="bkt-final-col">
      ${bktMatchHtml(final)}
      <div class="bkt-trophy">🏆</div>
      ${STATE.champion ? `<div class="bkt-champion">${teamName(STATE.champion)}</div>` : ''}
    </div>
    <div class="bkt-half half-right">
      <div class="bkt-round round-sf">${bktMatchHtml(sfR)}</div>
      <div class="bkt-round round-qf">${bktPairsHtml(qfR)}</div>
      <div class="bkt-round round-r16">${bktPairsHtml(r16R)}</div>
    </div>
  </div>`;
}

function renderForumMessages(list, idn, adminView){
  const msgs = list.slice().sort((a,b)=> b.ts - a.ts);
  if(!msgs.length) return `<div class="empty">لا رسائل بعد، كن أول من يكتب 💬</div>`;
  const voter = idn ? voterKeyForIdentity(idn) : null;
  return msgs.map(m=>{
    const authorName = m.authorType==='founder' ? ('<span class="ico ico-gold" style="width:20px;height:20px;font-size:11px">👑</span> المؤسس ('+(STATE.founderHandle||FOUNDER_HANDLE_DEFAULT)+')') : teamName(m.teamId);
    const cls = messageBorderClass(m);
    const time = new Date(m.ts).toLocaleString('ar', {hour:'2-digit', minute:'2-digit', day:'2-digit', month:'2-digit'});
    const reactBtns = REACTIONS.map(em=>{
      const listR = (m.reactions && m.reactions[em]) || [];
      const mine = voter && listR.includes(voter);
      const tag = adminView ? 'span' : 'button';
      return `<${tag} class="reaction-btn ${mine?'mine':''}" ${adminView?'':`data-msg="${m.id}" data-emoji="${em}"`}>${em}${listR.length? ' '+listR.length:''}</${tag}>`;
    }).join('');
    const summary = REACTIONS.filter(em=> m.reactions && m.reactions[em] && m.reactions[em].length)
      .map(em=> em+' '+reactionVoterNames(m.reactions[em])).join(' · ');
    const delBtn = adminView ? `<div class="tiny mt14 forum-del-btn" data-msg="${m.id}" style="cursor:pointer;color:var(--red-2)">حذف هذه الرسالة 🗑</div>` : '';
    return `<div class="msg-card ${cls}">
      <div class="msg-head"><span class="msg-name">${authorName}</span><span class="msg-time">${time}</span></div>
      <div class="msg-text">${renderMessageHtml(m.text)}</div>
      <div class="reactions">${reactBtns}</div>
      ${summary? `<div class="tiny mt14">${summary}</div>`:''}
      ${delBtn}
    </div>`;
  }).join('');
}

function formatRemaining(ms){

  const h = Math.floor(ms/3600000);

  return `${h} ساعة و ${m} دقيقة متبقية`;

    return screenAdminGrade();

  const qs = m.questions.map((q,i)=>`
    <label>سؤال ${i+1} — حدد مستوى الصعوبة</label>
    ${diffButtonsRow(i, q.difficulty)}
    <textarea class="qtext-input" data-qi="${i}" placeholder="نص السؤال ${i+1}">${q.text}</textarea>`).join('');
  return `<div class="back" data-go="${backTarget}">→ رجوع</div>
  <div class="card">
    <h2>${teamName(m.teamA)} × ${teamName(m.teamB)}</h2>
    <div class="sub">${matchProgressLabel(m).n} أجابوا · ${PHASE_LABEL[m.phase]||'الدوري'}</div>
    <div class="grow-list">${qs}</div>
    <button class="btn btn-primary mt14" id="saveQuestionsBtn" data-match="${m.id}">حفظ الأسئلة</button>
  </div>`;
}

function findMatchById(id){
  if(!id) return null;
  const pools = [
    ...STATE.league.rounds.flat(),
    ...STATE.playoff.matches, ...STATE.r16.matches, ...STATE.qf.matches, ...STATE.sf.matches,
    STATE.final.match
  ].filter(Boolean);
  return pools.find(m=>m.id===id);
}

function screenAdminGrade(){
  const m = findMatchById(UI._openMatch);
  if(!m) return `<div class="empty">تعذر إيجاد المباراة</div>`;
  const backTarget = m.phase==='league' ? 'admin-round' : 'admin-knockout';
  const rows = m.questions.map((q,i)=>{
    if(!q.a.text && !q.b.text) return ''; // skip totally unanswered slots (shouldn't happen if both done)
    const voiceBtn = (side)=> q[side].hasVoice
      ? `<button class="voice-btn has" data-voice-load="${m.id}:${i}:${side}">🎙 تشغيل التسجيل</button>`
      : `<span class="voice-btn" style="opacity:.4;cursor:default">🎙 لا يوجد تسجيل</span>`;
    return `<div class="grade-q" data-qi="${i}">
      <div class="qh">سؤال ${i+1}: ${q.text||'(بدون نص)'}</div>
      <div class="ans-block">
        <div class="who">${teamName(m.teamA)}</div>
        <div class="txt">${q.a.text || '—'}</div>
        ${voiceBtn('a')}
        <div class="voice-player" id="voicePlayer-${m.id}-${i}-a"></div>
        <div class="judge-btns">
          <button class="jbtn correct ${q.a.judge===true?'active':''}" data-side="a" data-val="true">صحيح</button>
          <button class="jbtn wrong ${q.a.judge===false?'active':''}" data-side="a" data-val="false">خاطئ</button>
        </div>
      </div>
      <div class="ans-block">
        <div class="who">${teamName(m.teamB)}</div>
        <div class="txt">${q.b.text || '—'}</div>
        ${voiceBtn('b')}
        <div class="voice-player" id="voicePlayer-${m.id}-${i}-b"></div>
        <div class="judge-btns">
          <button class="jbtn correct ${q.b.judge===true?'active':''}" data-side="b" data-val="true">صحيح</button>
          <button class="jbtn wrong ${q.b.judge===false?'active':''}" data-side="b" data-val="false">خاطئ</button>
        </div>
      </div>
    </div>`;
  }).join('');
  const countA = m.questions.filter(q=>q.a.judge===true).length;
  const countB = m.questions.filter(q=>q.b.judge===true).length;
  const isLeague = m.phase==='league';
  const isFinished = m.status==='finished';
  const isExpired = m.status==='expired';
  const forfeitNote = (m.forfeit==='a'||m.forfeit==='b') ? ' — حسمها النظام تلقائياً بالتغيّب بعد انتهاء مهلة الـ24 ساعة' : '';
  const finishedBanner = isFinished
    ? `<div class="pill pill-ready mb8">منتهية — الفائز الحالي: ${m.winner==='draw' ? 'تعادل' : teamName(m.winner)}${forfeitNote}</div>
       <div class="tiny mb8">هذه المباراة منتهية بالفعل. يمكنك تصحيح النتيجة أدناه في حال حصل خطأ في التصحيح أو غش من أحد الطرفين.
       تنبيه: إذا كانت هذه المباراة استُخدمت لتوليد قرعة الدور التالي، فتغيير الفائز هنا لن يحدّث تلك المباريات تلقائياً — راجعها وعدّلها يدوياً أيضاً إذا لزم الأمر.</div>`
    : (isExpired
      ? `<div class="pill pill-half mb8">⏱ انتهت مهلة الـ24 ساعة ولم يحسمها النظام تلقائياً (تعادل في المشاركة)</div>
         <div class="tiny mb8">لم يتّضح أي طرف شارك أكثر قبل انتهاء الوقت. اختر الفائز يدوياً أدناه — أو التعادل إن كانت مباراة دوري.</div>`
      : '');
  return `<div class="back" data-go="${backTarget}">→ رجوع</div>
  <div class="card">
    <h2>تصحيح: ${teamName(m.teamA)} × ${teamName(m.teamB)}</h2>
    ${finishedBanner}
    <div class="sub">حدد صحيح/خاطئ لكل إجابة ثم اعتمد النتيجة</div>
    <div class="grow-list">${rows}</div>
    <div class="tally">
      <div><b>${countA}</b><span>${teamName(m.teamA)}</span></div>
      <div><b>${countB}</b><span>${teamName(m.teamB)}</span></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-blue" id="winA">${isFinished?'تصحيح الفائز: ':'فوز '}${teamName(m.teamA)}</button>
      <button class="btn btn-blue" id="winB">${isFinished?'تصحيح الفائز: ':'فوز '}${teamName(m.teamB)}</button>
    </div>
    ${isLeague ? `<button class="btn btn-ghost mt14" id="drawBtn">تعادل (نقطة لكل فريق)</button>`
               : `<button class="btn btn-gold mt14" id="drawBtn">تعادل — أضف 5 أسئلة وقت إضافي</button>`}
  </div>`;
}

function screenAdminKnockout(){
  const stage = STATE.stage;
  const list = matchesOfStage(stage);
  const acc = STATE[stage];
  const startedAt = acc ? acc.startedAt : null;
  const rows = list.map(m=>{
    const prog = matchProgressLabel(m);
    const label = matchRowLabel(m, prog);
    const cls = m.status==='finished' ? 'pill-ready' : (m.status==='expired' ? 'pill-half' : prog.cls);
    return `<div class="match-row" data-match="${m.id}">
      <div class="teams">${teamName(m.teamA)}<span class="vs">×</span>${teamName(m.teamB)}</div>
      <span class="pill ${cls}">${label}</span>
    </div>`;
  }).join('');
  const canAdvance = allFinished(list);
  let advanceBtn = '';
  if(canAdvance){
    if(stage==='playoff') advanceBtn = `<button class="btn btn-gold mt14" id="advanceBtn">سحب قرعة دور الـ16 (16 فريق)</button>`;
    if(stage==='r16') advanceBtn = `<button class="btn btn-gold mt14" id="advanceBtn">الانتقال إلى ربع النهائي</button>`;
    if(stage==='qf') advanceBtn = `<button class="btn btn-gold mt14" id="advanceBtn">الانتقال إلى نصف النهائي</button>`;
    if(stage==='sf') advanceBtn = `<button class="btn btn-gold mt14" id="advanceBtn">الانتقال إلى النهائي</button>`;
    if(stage==='final') advanceBtn = `<button class="btn btn-gold mt14" id="advanceBtn">🏆 تتويج البطل</button>`;
  }
  return `<div class="back" data-go="admin-home">→ رجوع</div>
  <div class="card">
    <h2>${PHASE_LABEL[stage]}</h2>
    ${deadlineBannerFromStart(startedAt)}
    <div class="sub">اضغط على مباراة لكتابة الأسئلة أو التصحيح. لا يستطيع المشاركون الإجابة حتى تُفعّل عدّاد الـ24 ساعة لهذا الدور.</div>
    ${rows || '<div class="empty">لا توجد مباريات هنا بعد</div>'}
    ${!startedAt ? `<button class="btn btn-ghost mt14" id="startStageBtn" data-stage="${stage}">تفعيل عدّاد 24 ساعة لهذا الدور</button>` : ''}
    ${advanceBtn}
  </div>`;
}

/* =========================================================
   EVENTS
   ========================================================= */
function bindEvents(){
  const modalOkBtn = document.getElementById('modalOkBtn');
  if(modalOkBtn) modalOkBtn.onclick = ()=>{
    const modal = UI.modal;
    UI.modal = null;
    if(modal && modal.type==='confirm' && modal.onConfirm) modal.onConfirm();
    else render();
  };
  const modalCancelBtn = document.getElementById('modalCancelBtn');
  if(modalCancelBtn) modalCancelBtn.onclick = ()=>{ UI.modal = null; render(); };

  document.querySelectorAll('[data-go]').forEach(elx=>{
    elx.onclick = ()=>{
      const target = elx.getAttribute('data-go');
      // leaving the admin panel back to the public home screen drops founder identity in the forum
      if(target==='home' && UI.screen && UI.screen.indexOf('admin')===0) UI._isAdmin = false;
      UI.screen = target; render();
    };
  });

  // login by secret code
  const loginCodeBtn = document.getElementById('loginCodeBtn');
  if(loginCodeBtn) loginCodeBtn.onclick = async ()=>{
    const v = document.getElementById('loginCodeInput').value.trim().toUpperCase();
    if(!v) return;
    const found = STATE.teams.find(t=>t.code===v);
    if(!found){ showAlert('الرمز غير صحيح، تأكد منه مع المؤسس'); return; }
    UI._isAdmin = false; // logging in with a team code always drops any leftover founder identity
    await setMyTeam(found.id);
    UI.screen='play'; render();
  };

  const logoutBtn = document.getElementById('logoutBtn');
  if(logoutBtn) logoutBtn.onclick = async ()=>{
    UI._isAdmin = false; // logging out always drops any leftover founder identity too
    await logout();
    UI.screen='home'; render();
  };

  // voice-recording consent (anti-cheat) — required once per team before their first question
  const voiceConsentBtn = document.getElementById('voiceConsentBtn');
  if(voiceConsentBtn) voiceConsentBtn.onclick = async ()=>{
    await mutate(s=>{
      STATE = s;
      const t = s.teams.find(x=>x.id===MY_TEAM);
      if(t) t.voiceConsent = true;
    });
    render();
  };

  // play screen: timer + submit
  const submitBtn = document.getElementById('submitAnswerBtn');
  if(submitBtn){
    startPlayTimer();
    startVoiceRecording();
    submitBtn.onclick = ()=> submitCurrentAnswer();
  }

  // admin login
  const loginBtn = document.getElementById('adminLoginBtn');
  if(loginBtn) loginBtn.onclick = ()=>{
    const v = document.getElementById('adminCodeInput').value.trim();
    if(v === STATE.adminCode){ UI._showRecovery=false; UI._isAdmin=true; UI.screen='admin-home'; render(); }
    else showAlert('رمز غير صحيح');
  };

  const forgotLink = document.getElementById('forgotCodeLink');
  if(forgotLink) forgotLink.onclick = ()=>{ UI._showRecovery = !UI._showRecovery; render(); };

  const recoveryBtn = document.getElementById('recoveryLoginBtn');
  if(recoveryBtn) recoveryBtn.onclick = ()=>{
    const v = document.getElementById('recoveryCodeInput').value.trim();
    if(v === ADMIN_RECOVERY_CODE){ UI._showRecovery=false; UI._isAdmin=true; UI.screen='admin-home'; render(); }
    else showAlert('الرمز الاحتياطي غير صحيح');
  };

  const genLeagueRandomBtn = document.getElementById('genLeagueRandomBtn');
  if(genLeagueRandomBtn) genLeagueRandomBtn.onclick = ()=>{
    showConfirm('سيتم توليد جدول 8 جولات بقرعة عشوائية بالكامل (16 مباراة لكل جولة). هل أنت متأكد؟', async ()=>{
      await mutate(s=>{ STATE=s; generateLeague(); });
      UI.screen='admin-round'; render();
    });
  };

  // manual round-1 draw screen
  document.querySelectorAll('.draw-team-btn').forEach(b=>{
    b.onclick = ()=>{
      const id = b.getAttribute('data-team');
      if(!UI._draftPairs) UI._draftPairs = [];
      if(!UI._draftPending){
        UI._draftPending = id;
      } else if(UI._draftPending===id){
        UI._draftPending = null;
      } else {
        UI._draftPairs.push([UI._draftPending, id]);
        UI._draftPending = null;
      }
      render();
    };
  });
  document.querySelectorAll('.remove-pair-btn').forEach(b=>{
    b.onclick = ()=>{
      UI._draftPairs.splice(parseInt(b.getAttribute('data-i')),1);
      render();
    };
  });
  const confirmDrawR1Btn = document.getElementById('confirmDrawR1Btn');
  if(confirmDrawR1Btn) confirmDrawR1Btn.onclick = ()=>{
    if(!UI._draftPairs || UI._draftPairs.length!==16) return;
    showConfirm('سيتم توليد جدول 8 جولات: الجولة الأولى بمواجهاتك، والباقي عشوائي دون تكرار. هل أنت متأكد؟', async ()=>{
      const pairs = UI._draftPairs.slice();
      await mutate(s=>{ STATE=s; generateLeague(pairs); });
      UI._draftPairs=[]; UI._draftPending=null;
      UI.screen='admin-round'; render();
    });
  };

  const saveCodeBtn = document.getElementById('saveCodeBtn');
  if(saveCodeBtn) saveCodeBtn.onclick = async ()=>{
    const v = document.getElementById('newCode').value.trim();
    if(!v) return;
    await mutate(s=>{ s.adminCode=v; });
    document.getElementById('newCode').value='';
    document.getElementById('newCode').placeholder = v;
  };

  const saveTeamsBtn = document.getElementById('saveTeamsBtn');
  if(saveTeamsBtn) saveTeamsBtn.onclick = async ()=>{
    const inputs = document.querySelectorAll('.teamname-input');
    const names = Array.from(inputs).map(i=>i.value.trim() || 'مشارك');
    await mutate(s=>{
      names.forEach((n,i)=> s.teams[i].name = n);
      // make sure every participant has a code (covers any future expansion)
      const existing = new Set(s.teams.map(t=>t.code).filter(Boolean));
      s.teams.forEach(t=>{ if(!t.code){ t.code = generateCode(existing); existing.add(t.code); } });
    });
    UI.screen='admin-home'; render();
  };

  document.querySelectorAll('.regen-code-btn').forEach(b=>{
    b.onclick = ()=>{
      const idx = parseInt(b.getAttribute('data-idx'));
      showConfirm('سيتم إبطال الرمز القديم لهذا المشارك وتوليد رمز جديد. متابعة؟', async ()=>{
        await mutate(s=>{
          const existing = new Set(s.teams.map(t=>t.code).filter(Boolean));
          existing.delete(s.teams[idx].code);
          s.teams[idx].code = generateCode(existing);
        });
        render();
      });
    };
  });

  // round tabs
  document.querySelectorAll('[data-round]').forEach(b=>{
    b.onclick = ()=>{ STATE.league.currentRound = parseInt(b.getAttribute('data-round')); render(); };
  });

  // match rows -> open match (questions or grading)
  document.querySelectorAll('[data-match]').forEach(row=>{
    row.onclick = ()=>{
      UI._openMatch = row.getAttribute('data-match');
      const m = findMatchById(UI._openMatch);
      UI.screen = (m.status==='finished' || m.status==='expired' || (sideDone(m,'a') && sideDone(m,'b'))) ? 'admin-grade' : 'admin-match';
      render();
    };
  });

  const saveQBtn = document.getElementById('saveQuestionsBtn');
  if(saveQBtn) saveQBtn.onclick = async ()=>{
    const matchId = saveQBtn.getAttribute('data-match');
    const texts = {};
    document.querySelectorAll('.qtext-input').forEach(t=> texts[t.getAttribute('data-qi')] = t.value);
    const difficulties = {};
    document.querySelectorAll('.diff-row').forEach(row=>{
      const qi = row.getAttribute('data-qi');
      const activeBtn = row.querySelector('.diffbtn.active');
      difficulties[qi] = activeBtn ? activeBtn.getAttribute('data-diff') : null;
    });
    await mutate(s=>{
      STATE = s;
      const m = findMatchById(matchId);
      Object.keys(texts).forEach(i=>{
        m.questions[i].text = texts[i];
        m.questions[i].difficulty = difficulties[i] || null;
      });
      if(m.questions.some(q=>q.text)) m.status='ready';
    });
    UI.screen='admin-round'; render();
  };

  // difficulty picker toggles — kept purely client-side until "save" so unsaved question text isn't lost mid-edit
  document.querySelectorAll('.diffbtn').forEach(b=>{
    b.onclick = ()=>{
      const row = b.closest('.diff-row');
      row.querySelectorAll('.diffbtn').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
    };
  });

  // grading toggles
  document.querySelectorAll('.jbtn').forEach(b=>{
    b.onclick = async ()=>{
      const qi = b.closest('.grade-q').getAttribute('data-qi');
      const side = b.getAttribute('data-side');
      const val = b.getAttribute('data-val')==='true';
      await mutate(s=>{
        STATE=s;
        const m = findMatchById(UI._openMatch);
        m.questions[qi][side].judge = val;
      });
      render();
    };
  });

  const winA = document.getElementById('winA');
  if(winA) winA.onclick = ()=> finalizeMatch('teamA');
  const winB = document.getElementById('winB');
  if(winB) winB.onclick = ()=> finalizeMatch('teamB');
  const drawBtn = document.getElementById('drawBtn');
  if(drawBtn) drawBtn.onclick = ()=> finalizeDraw();

  const startRoundBtn = document.getElementById('startRoundBtn');
  if(startRoundBtn) startRoundBtn.onclick = async ()=>{
    const rn = startRoundBtn.getAttribute('data-round');
    await mutate(s=>{ s.league.roundStarted[rn] = Date.now(); });
    render();
  };

  const startStageBtn = document.getElementById('startStageBtn');
  if(startStageBtn) startStageBtn.onclick = async ()=>{
    const stage = startStageBtn.getAttribute('data-stage');
    await mutate(s=>{ s[stage].startedAt = Date.now(); });
    render();
  };

  const finishLeagueBtn = document.getElementById('finishLeagueBtn');
  if(finishLeagueBtn) finishLeagueBtn.onclick = ()=>{
    showConfirm('سيتم إغلاق الدوري وتحديد المتأهلين (البلي أوف بين المراكز 9–24). متابعة؟', async ()=>{
      await mutate(s=>{ STATE=s; startPlayoffFromStandings(); });
      UI.screen='admin-knockout'; render();
    });
  };

  // forum: founder handle setting
  const saveFounderHandleBtn = document.getElementById('saveFounderHandleBtn');
  if(saveFounderHandleBtn) saveFounderHandleBtn.onclick = async ()=>{
    const v = normalizeHandle(document.getElementById('newFounderHandle').value.trim());
    if(!v) return;
    await mutate(s=>{ s.founderHandle = v; });
    render();
  };

  // forum: compose + char counter
  const forumInput = document.getElementById('forumInput');
  if(forumInput){
    const counter = document.getElementById('forumCharCount');
    if(counter){
      forumInput.addEventListener('input', ()=>{ counter.textContent = forumInput.value.length + ' / ' + forumInput.maxLength; });
    }
  }
  const forumSendBtn = document.getElementById('forumSendBtn');
  if(forumSendBtn) forumSendBtn.onclick = async ()=>{
    const input = document.getElementById('forumInput');
    const text = input ? input.value.trim() : '';
    if(!text) return;
    await sendForumMessage(text);
    render();
  };

  // forum: reactions
  document.querySelectorAll('.reaction-btn[data-emoji]').forEach(b=>{
    b.onclick = async ()=>{
      await toggleReaction(b.getAttribute('data-msg'), b.getAttribute('data-emoji'));
      render();
    };
  });

  // forum: delete message (founder only)
  document.querySelectorAll('.forum-del-btn').forEach(b=>{
    b.onclick = ()=>{
      const id = b.getAttribute('data-msg');
      showConfirm('سيتم حذف هذه الرسالة نهائياً. متابعة؟', async ()=>{
        await deleteForumMessage(id);
        render();
      });
    };
  });

  // admin: load & play a saved voice recording for one answer (founder only)
  document.querySelectorAll('[data-voice-load]').forEach(b=>{
    b.onclick = async ()=>{
      const [matchId, qi, side] = b.getAttribute('data-voice-load').split(':');
      const slot = document.getElementById('voicePlayer-'+matchId+'-'+qi+'-'+side);
      if(!slot) return;
      slot.innerHTML = '<span class="tiny">جارٍ التحميل...</span>';
      try{
        const r = await window.storage.get('voice:'+matchId+':'+qi+':'+side, true);
        if(!r || !r.value){ slot.innerHTML = '<span class="tiny">التسجيل غير موجود (ربما حُذف).</span>'; return; }
        const rec = JSON.parse(r.value);
        slot.innerHTML = `<audio controls src="data:${rec.mime};base64,${rec.data}"></audio>
          <div class="tiny mt14 forum-del-btn" data-voice-del="${matchId}:${qi}:${side}" style="cursor:pointer;color:var(--red-2)">حذف هذا التسجيل 🗑</div>`;
      }catch(e){ slot.innerHTML = '<span class="tiny">تعذر تحميل التسجيل.</span>'; }
    };
  });

  // forum: mute/unmute a participant (founder only)
  document.querySelectorAll('.mute-toggle-btn').forEach(b=>{
    b.onclick = async ()=>{
      await toggleMute(b.getAttribute('data-team'));
      render();
    };
  });

  const advanceBtn = document.getElementById('advanceBtn');
  if(advanceBtn) advanceBtn.onclick = async ()=>{
    await mutate(s=>{
      STATE = s;
      if(STATE.stage==='playoff') drawR16();
      else if(STATE.stage==='r16') advanceToQF();
      else if(STATE.stage==='qf') advanceToSF();
      else if(STATE.stage==='sf') advanceToFinal();
      else if(STATE.stage==='final') crownChampion();
    });
    render();
  };
}

async function finalizeMatch(sideKeyName){
  await mutate(s=>{
    STATE=s;
    const m = findMatchById(UI._openMatch);
    const winnerId = m[sideKeyName];
    m.winner = winnerId;
    m.status = 'finished';
  });
  UI.screen = STATE.league.rounds.flat().some(m=>m.id===UI._openMatch) ? 'admin-round' : 'admin-knockout';
  render();
}

async function finalizeDraw(){
  const m0 = findMatchById(UI._openMatch);
  if(m0.phase==='league'){
    await mutate(s=>{
      STATE=s;
      const m = findMatchById(UI._openMatch);
      m.winner='draw'; m.status='finished';
    });
    UI.screen='admin-round'; render();
  } else {
    // knockout tie: append 5 sudden-death questions, reopen the match
    await mutate(s=>{
      STATE=s;
      const m = findMatchById(UI._openMatch);
      for(let i=0;i<5;i++){
        m.questions.push({text:'', difficulty:null, a:{text:'',judge:null}, b:{text:'',judge:null}});
      }
      m.status='ready';
    });
    UI.screen='admin-match'; render();
  }
}

/* ---------------- play timer + answer submit ---------------- */
/* ---------------- anti-cheat indicator (deterrent-only, per question) ----------------
   NOTE: this is intentionally a visual deterrent, not a real recorder. It never calls
   getUserMedia and never touches the mic — the green-ringed 🎙 badge just displays while
   the question is on screen. Nothing is captured, stored, or uploaded. Kept deliberately
   simple so a maintainer can wire in real recording later if the hosting environment
   supports persisting media (the earlier getUserMedia+MediaRecorder version is still a
   valid approach for that, but it depends on a storage backend to actually save clips). */
function startVoiceRecording(){
  VOICE_READY = Promise.resolve(false); // never claims a real recording exists
  const ind = document.getElementById('recIndicator');
  if(ind) ind.style.visibility = 'visible';
}
// no-op: nothing was recorded, so there is nothing to stop/save. Kept as an async
// function so existing call sites (submitCurrentAnswer) don't need to change.
async function stopVoiceRecordingAndSave(matchId, qi, side){
  const ind = document.getElementById('recIndicator');
  if(ind) ind.style.visibility = 'hidden';
}

function startPlayTimer(){
  clearInterval(PLAY_TIMER);
  PLAY_SECS = 20;
  const t = document.getElementById('playTimer');
  if(t) t.textContent = PLAY_SECS;
  PLAY_TIMER = setInterval(()=>{
    PLAY_SECS--;
    const tt = document.getElementById('playTimer');
    if(tt){ tt.textContent = PLAY_SECS; if(PLAY_SECS<=5) tt.classList.add('low'); }
    if(PLAY_SECS<=0){
      clearInterval(PLAY_TIMER);
      playTimeUpSound();
      submitCurrentAnswer();
    } else if(PLAY_SECS<=5){
      playTickUrgentSound();
    } else {
      playTickSound();
    }
  },1000);
}
async function submitCurrentAnswer(){
  clearInterval(PLAY_TIMER);
  const box = document.getElementById('answerBox');
  const text = (box ? box.value.trim() : '') || '(بدون إجابة)';
  const matchId = UI._matchId, side = UI._side, qi = UI._qi;
  await stopVoiceRecordingAndSave(matchId, qi, side);
  await mutate(s=>{
    STATE = s;
    const m = findMatchById(matchId);
    if(m) m.questions[qi][side].text = text;
  });
  render(); // will move to next question or show waiting screen
}

/* ---------------- boot ---------------- */
document.addEventListener('click', function(e){
  const t = e.target.closest('button, .btn, .back, [data-go], .jbtn, .draw-team-btn');
  if(t) playClickSound();
}, true);

// admin: delete a reviewed voice recording — delegated once here (not in bindEvents) because
// the delete button is injected dynamically after loading, without a full render() pass.
document.addEventListener('click', function(e){
  const b = e.target.closest('[data-voice-del]');
  if(!b) return;
  const [matchId, qi, side] = b.getAttribute('data-voice-del').split(':');
  showConfirm('سيتم حذف هذا التسجيل الصوتي نهائياً. متابعة؟', async ()=>{
    try{ await window.storage.delete('voice:'+matchId+':'+qi+':'+side, true); }catch(err){}
    await mutate(s=>{
      STATE = s;
      const m = findMatchById(matchId);
      if(m && m.questions[qi]) m.questions[qi][side].hasVoice = false;
    });
    render();
  });
});

(async function boot(){
  await loadState();
  await loadForumLastRead();
  await checkForfeitsAndSave(); // resolve any matches whose 24h window already expired before this device opened the app
  await render();
  // light polling so players/admin see updates without a manual refresh, and to keep sweeping for expired 24h deadlines
  setInterval(async ()=>{
    if(document.getElementById('answerBox')) return; // don't yank state while someone is mid-answer
    if(IS_MUTATING) return; // don't read while a save is in flight — avoids racing/overwriting it
    // don't yank state (and wipe what's typed) while the user is actively focused on ANY
    // text field — forum message, participant names, admin codes, question text, etc.
    // This covers every current and future input without having to list each id here.
    const active = document.activeElement;
    if(active && document.body.contains(active)){
      const tag = active.tagName;
      if(tag==='INPUT' || tag==='TEXTAREA' || active.isContentEditable) return;
    }
    try{
      const r = await window.storage.get('tournament', true);
      if(r && r.value) STATE = JSON.parse(r.value);
      await checkForfeitsAndSave();
      render();
    }catch(e){}
  }, 8000);
})();
</script>
